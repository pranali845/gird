
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h2>Dashboard Header</h2>
        </header>

        <nav class="navigation">
            <h3>Navigation</h3>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Settings</a>
        </nav>

        <main class="main">
            <h2>Main Content</h2>
            <p>Welcome to your dashboard!</p>
            <p>This is the main content area.</p>
        </main>

        <aside class="aside">
            <h3>Aside</h3>
            <p>Notifications</p>
            <p>Recent Updates</p>
        </aside>

        <footer class="footer">
            <p>© 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
