<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Grid</title>
    <link rel="stylesheet" href="poster.css">
</head>

<body>

    <div class="container">

        <div class="grid-item box1">
            <p>Lost in the stars</p>
        </div>

        <div class="grid-item box2">
            <p>Instagram is toxic but I keep posting</p>
        </div>

        <div class="grid-item box3">
            <p>Throwing my phone into the ocean</p>
        </div>

        <div class="grid-item box4">
            <p>I'm never leaving my room</p>
        </div>

        <div class="grid-item box5">
            <p>Staring at the horizon thinking</p>
        </div>

        <div class="grid-item box6">
            <p>This is water</p>
        </div>

        <div class="grid-item box7">
            <p>Table for one please</p>
        </div>

    </div>

</body>

</html>
