<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Layout</title>
    <!-- Linking the external stylesheet -->
    <link rel="stylesheet" href="img.css">
</head>

<body>

    <div class="page-container">
        <!-- Header -->
        <header class="box header">Header</header>

        <!-- Navigation Menu -->
        <nav class="box nav-menu">Navigation Menu</nav>

        <!-- Middle Section (3 Columns) -->
        <div class="main-wrapper">
            <aside class="box content-sidebar">Content</aside>
            <main class="box main-content">Main Content</main>
            <aside class="box content-sidebar">Content</aside>
        </div>

        <!-- Footer -->
        <footer class="box footer">Footer</footer>
    </div>

</body>

</html>
